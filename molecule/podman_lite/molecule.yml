---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: ubuntu
    image: ubuntu:22.04
    pre_build_image: true
    command: sleep infinity

  - name: rhel8like
    image: rockylinux:8
    pre_build_image: true
    command: sleep infinity

provisioner:
  name: ansible
  config_options:
    defaults:
      become: false
      interpreter_python: auto_silent
      remote_tmp: /tmp/.ansible/tmp
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible
