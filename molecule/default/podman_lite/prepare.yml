---
- name: Prepare
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Install python3.8 on rhel8like (raw)
      ansible.builtin.raw: |
        dnf -y install python38 python38-dnf || dnf -y install python38 || true
      changed_when: false
      when: ansible_os_family in ['RedHat', 'Rocky', 'AlmaLinux'] or ansible_distribution in ['Rocky', 'AlmaLinux', 'CentOS', 'RedHat']
      ignore_errors: true

    - name: Set python interpreter for rhel8like
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3.8
      when: ansible_os_family in ['RedHat', 'Rocky', 'AlmaLinux'] or ansible_distribution in ['Rocky', 'AlmaLinux', 'CentOS', 'RedHat']

    - name: Gather facts (after fixing python)
      ansible.builtin.setup: